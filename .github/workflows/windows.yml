# Gera o instalador do Clover RP para Windows (Tauri). Roda quando o app de Windows muda ou quando o dono manda.
# O instalador fica em "Artifacts" na página da execução; nada é publicado sozinho.
name: Clover RP Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          CLOVER_SERVER_URL: ${{ vars.CLOVER_SERVER_URL }}
      - run: npx tauri icon src-tauri/app-icon.png -o src-tauri/icons
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: clover-rp-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
